name: Build PDF vers PPT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-26, arch: arm64 }
          - { os: macos-13, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-vers-PPT-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/PDF-vers-PPT-mac-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "PDF vers PPT" --icon assets\icon.ico --add-data "assets;assets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-vers-PPT-windows
          path: dist/PDF vers PPT.exe
